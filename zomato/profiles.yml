zomato:
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      database: ZOMATO
      warehouse: ZOMATO_WH
      schema: STAGING
      role: DBT_ROLE
      threads: 8
  target: dev
